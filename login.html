<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title id="pageTitle">Вход — SecureMind</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="variables.css"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="app.css">
</head>
<body>
<div class="auth-page">
  <button class="lang-toggle" id="langToggle" onclick="toggleLang()" title="Қазақша / Русский" style="position:fixed;top:20px;right:20px;z-index:10">KZ</button>
  <div class="auth-panel">
    <div class="auth-logo">
      <div class="logo-icon"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2L3 5.5V10c0 4.1 3 7.9 7 8.9 4-1 7-4.8 7-8.9V5.5L10 2z" fill="#00D4AA"/></svg></div>
      <span class="logo-text">SecureMind</span>
    </div>
    <h1 class="auth-title" data-i18n="login_title">Добро пожаловать!</h1>
    <p class="auth-sub" data-i18n="login_sub">Введи свои данные для входа</p>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" data-i18n="login_email_label">Email</label>
        <input type="email" class="form-input" id="email" data-i18n-placeholder="login_email_placeholder" placeholder="ivan@example.com">
        <div class="form-error" id="errEmail" data-i18n="login_err_email">Введите корректный email</div>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="login_password_label">Пароль</label>
        <div style="position:relative">
          <input type="password" class="form-input" id="password" data-i18n-placeholder="login_password_placeholder" placeholder="Ваш пароль" style="padding-right:44px">
          <button type="button" onclick="const i=document.getElementById('password');i.type=i.type==='password'?'text':'password'" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem">👁️</button>
        </div>
        <div class="form-error" id="errPw" data-i18n="login_err_password">Введите пароль</div>
      </div>
      <div style="text-align:right;margin-bottom:20px"><a href="#" style="font-size:.85rem;color:var(--accent-dark)" data-i18n="login_forgot">Забыл пароль?</a></div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" data-i18n="login_submit">Войти</button>

      <div style="margin:20px 0;text-align:center;color:var(--text-3);font-size:.85rem" data-i18n="login_or">— или —</div>
      <button type="button" onclick="demoLogin('student')" class="btn btn-outline btn-full" style="margin-bottom:8px" data-i18n="login_demo_student">🎓 Демо-вход как Ученик</button>
      <button type="button" onclick="demoLogin('teacher')" class="btn btn-outline btn-full" data-i18n="login_demo_teacher">👩‍🏫 Демо-вход как Учитель</button>
    </form>
    <div class="auth-footer-link"><span data-i18n="login_no_account">Нет аккаунта?</span> <a href="register.html" data-i18n="login_register_link">Зарегистрироваться</a></div>
  </div>
  <div class="auth-hero">
    <div class="auth-hero-content">
      <div style="font-size:5rem;margin-bottom:24px">🔐</div>
      <h2 data-i18n="login_hero_title">Продолжи своё обучение</h2>
      <p data-i18n="login_hero_sub">Твой прогресс сохранён. Вернись и пройди следующий сценарий!</p>
    </div>
  </div>
</div>
<script>
// Язык синхронизирован с index.html через localStorage('securemind_lang')
const i18n = {
  ru: {
    pageTitle: 'Вход — SecureMind',
    login_title: 'Добро пожаловать!', login_sub: 'Введи свои данные для входа',
    login_email_label: 'Email', login_email_placeholder: 'ivan@example.com',
    login_password_label: 'Пароль', login_password_placeholder: 'Ваш пароль',
    login_err_email: 'Введите корректный email', login_err_password: 'Введите пароль',
    login_forgot: 'Забыл пароль?', login_submit: 'Войти', login_or: '— или —',
    login_demo_student: '🎓 Демо-вход как Ученик', login_demo_teacher: '👩‍🏫 Демо-вход как Учитель',
    login_no_account: 'Нет аккаунта?', login_register_link: 'Зарегистрироваться',
    login_hero_title: 'Продолжи своё обучение', login_hero_sub: 'Твой прогресс сохранён. Вернись и пройди следующий сценарий!'
  },
  kz: {
    pageTitle: 'Кіру — SecureMind',
    login_title: 'Қош келдіңіз!', login_sub: 'Кіру үшін деректеріңді енгіз',
    login_email_label: 'Email', login_email_placeholder: 'ivan@example.com',
    login_password_label: 'Құпия сөз', login_password_placeholder: 'Құпия сөзіңіз',
    login_err_email: 'Дұрыс email енгізіңіз', login_err_password: 'Құпия сөзді енгізіңіз',
    login_forgot: 'Құпия сөзді ұмыттыңыз ба?', login_submit: 'Кіру', login_or: '— немесе —',
    login_demo_student: '🎓 Демо-кіру Оқушы ретінде', login_demo_teacher: '👩‍🏫 Демо-кіру Мұғалім ретінде',
    login_no_account: 'Аккаунтыңыз жоқ па?', login_register_link: 'Тіркелу',
    login_hero_title: 'Оқуыңды жалғастыр', login_hero_sub: 'Прогрессің сақталған. Қайтып келіп келесі сценарийді өт!'
  }
};
let lang = localStorage.getItem('securemind_lang') || 'ru';
function applyLang(l) {
  if (!i18n[l]) return;
  document.documentElement.lang = l === 'kz' ? 'kk' : 'ru';
  document.title = i18n[l].pageTitle;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[l][key] !== undefined) el.textContent = i18n[l][key];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    if (i18n[l][key] !== undefined) el.placeholder = i18n[l][key];
  });
  var t = document.getElementById('langToggle');
  if (t) t.textContent = l === 'ru' ? 'KZ' : 'RU';
  localStorage.setItem('securemind_lang', l);
}
function toggleLang() { lang = lang === 'ru' ? 'kz' : 'ru'; applyLang(lang); }
applyLang(lang);

document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  const em=document.getElementById('email').value.trim().toLowerCase();
  const pw=document.getElementById('password').value;
  let ok=true;
  [['errEmail',!/\S+@\S+\.\S+/.test(em)],['errPw',pw.length<1]].forEach(([id,show])=>{document.getElementById(id).classList.toggle('show',show);if(show)ok=false});
  if(ok){
    if(em==='admin@mail.com'){
      var teacher={name:'Админ',email:'admin@mail.com',role:'teacher',grade:'',xp:0,level:1,streak:0,scenarios:{},diagnostic:true};
      localStorage.setItem('sm_user',JSON.stringify(teacher));
      window.location.href='teacher.html';
      return;
    }
    var user=JSON.parse(localStorage.getItem('sm_user')||'null');
    if(user){window.location.href=user.role==='teacher'?'teacher.html':'dashboard.html'}
    else{var demo={name:'Алижан Каким',email:em,role:'student',grade:'10',xp:250,level:2,streak:5,scenarios:{phishing:{done:true,score:87},social:{done:false},fake:{done:true,score:73}},diagnostic:true};localStorage.setItem('sm_user',JSON.stringify(demo));window.location.href='dashboard.html'}
  }
});
function demoLogin(role){
  if(role==='student'){
    const user={name:'Алижан Каким',email:'aigul@demo.kz',role:'student',grade:'10',xp:850,level:3,streak:12,scenarios:{phishing:{done:true,score:94},social:{done:true,score:78},fake:{done:true,score:82},qr:{done:false},password:{done:true,score:91}},diagnostic:true};
    localStorage.setItem('sm_user',JSON.stringify(user));window.location.href='dashboard.html';
  } else {
    const user={name:'Нурлан Ахметов',email:'teacher@demo.kz',role:'teacher',grade:'',xp:0,level:1,streak:0,scenarios:{},diagnostic:true};
    localStorage.setItem('sm_user',JSON.stringify(user));window.location.href='teacher.html';
  }
}
</script>
</body>
</html>
