<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Достижения — SecureMind</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="variables.css"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="app.css">
</head>
<body class="app-page">
<div class="app-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-icon"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2L3 5.5V10c0 4.1 3 7.9 7 8.9 4-1 7-4.8 7-8.9V5.5L10 2z" fill="#00D4AA"/></svg></div><span class="logo-text">SecureMind</span></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-nav-item"><span class="nav-icon">🏠</span> Главная</a>
      <a href="scenarios.html" class="sidebar-nav-item"><span class="nav-icon">🎮</span> Сценарии</a>
      <a href="progress.html" class="sidebar-nav-item"><span class="nav-icon">📊</span> Прогресс</a>
      <a href="achievements.html" class="sidebar-nav-item active"><span class="nav-icon">🏆</span> Достижения</a>
      <div class="sidebar-section">Аккаунт</div>
      <a href="index.html" class="sidebar-nav-item"><span class="nav-icon">🚪</span> Выйти</a>
    </nav>
  </aside>
  <main class="main-content">
    <div class="app-topbar"><div class="app-topbar-title">Достижения</div></div>
    <div class="page-content">
      <div class="stat-grid" style="margin-bottom:32px">
        <div class="stat-card"><div class="stat-card-icon" style="background:var(--risk-yellow-bg)">🏅</div><div class="stat-card-body"><strong id="unlockedCount">0</strong><span>Разблокировано</span></div></div>
        <div class="stat-card"><div class="stat-card-icon" style="background:var(--border)">🔒</div><div class="stat-card-body"><strong id="lockedCount">0</strong><span>Ещё не получено</span></div></div>
      </div>
      <div class="badges-grid" id="badgesGrid"></div>
    </div>
  </main>
</div>
<script>
const user=JSON.parse(localStorage.getItem('sm_user')||'{}');
const badges=[
  {id:'first_step',icon:'🌱',name:'Первый шаг',desc:'Пройди диагностический тест',cond:()=>user.diagnostic},
  {id:'phish_hunter',icon:'🎣',name:'Охотник за фишингом',desc:'5 фишинг-сценариев без ошибок',cond:()=>user.scenarios?.phishing?.score>=90},
  {id:'detective',icon:'🔍',name:'Детектив',desc:'Найди все признаки на «Поддельный сайт»',cond:()=>user.scenarios?.fake?.score>=95},
  {id:'unbreakable',icon:'💪',name:'Несгибаемый',desc:'7 дней стрик подряд',cond:()=>(user.streak||0)>=7},
  {id:'pw_master',icon:'🔐',name:'Мастер паролей',desc:'Создай пароль 100% надёжности',cond:()=>user.scenarios?.password?.score>=100},
  {id:'impenetrable',icon:'🛡️',name:'Непробиваемый',desc:'Все 6 сценариев на 90%+',cond:()=>Object.values(user.scenarios||{}).filter(s=>s.score>=90).length>=6},
  {id:'social_aware',icon:'🧠',name:'Социально осведомлён',desc:'Пройди сценарий соц. инженерии',cond:()=>user.scenarios?.social?.done},
  {id:'qr_expert',icon:'📲',name:'QR-эксперт',desc:'Распознай все QR-угрозы',cond:()=>user.scenarios?.qr?.score>=80},
  {id:'class_helper',icon:'🤝',name:'Помощник класса',desc:'Войди в топ-3 класса',cond:()=>(user.xp||0)>800},
  {id:'speedster',icon:'⚡',name:'Молния',desc:'Ответь на 5 вопросов менее чем за 10 секунд',cond:()=>(user.xp||0)>500},
  {id:'comeback',icon:'🔄',name:'Второй шанс',desc:'Улучши результат сценария повторно',cond:()=>false},
  {id:'all_done',icon:'🎓',name:'Кибер-специалист',desc:'Пройди все 6 сценариев',cond:()=>Object.keys(user.scenarios||{}).length>=6},
];

let unlocked=0,locked=0;
const grid=document.getElementById('badgesGrid');
badges.forEach(b=>{
  const isUnlocked=b.cond();
  if(isUnlocked)unlocked++;else locked++;
  grid.innerHTML+=`<div class="badge-item ${isUnlocked?'':'locked'}">
    <div class="badge-icon">${b.icon}</div>
    <div class="badge-name">${b.name}</div>
    <div class="badge-desc">${b.desc}</div>
    ${isUnlocked?'<div style="font-size:.7rem;color:var(--risk-green);font-weight:600;margin-top:6px">✅ Получено</div>':''}
  </div>`;
});
document.getElementById('unlockedCount').textContent=unlocked;
document.getElementById('lockedCount').textContent=locked;
</script>
<script src="chatbot.js"></script>
</body>
</html>
